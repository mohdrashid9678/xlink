global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'xlink_cluster'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - '10.0.1.10:8080'  # App Pod 1 (AZ-a)
          - '10.0.1.20:8080'  # App Pod 2 (AZ-a)
          - '10.0.3.10:8080'  # App Pod 3 (AZ-b)
        labels:
          app: 'xlink'
          env: 'production'
