user www-data;
worker_processes auto;
worker_rlimit_nofile 1048576;
pid /run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer optimizations
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Logging format optimized for low I/O overhead
    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Upstream pool connecting to 3 App Pods with HTTP keepalive
    upstream xlink_cluster {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        # In multi-instance cluster, add other private pod IPs:
        # server 10.0.1.11:8080 max_fails=3 fail_timeout=10s;
        # server 10.0.1.12:8080 max_fails=3 fail_timeout=10s;

        # Keep open 1,000 idle connections to backend to eliminate TCP handshake overhead
        keepalive 1000;
    }

    server {
        listen 80 default_server reuseport;
        listen [::]:80 default_server reuseport;
        server_name _;

        location / {
            proxy_pass http://xlink_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Low proxy timeouts for high-speed redirects
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # Health probe bypass
        location /healthz {
            proxy_pass http://xlink_cluster/healthz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
