services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: xlink:latest
    container_name: xlink-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
