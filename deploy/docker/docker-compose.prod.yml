services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: xlink-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
      - DB_URL=postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/xlink?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-replace-with-at-least-32-byte-secret-key-here}
      - AUTO_MIGRATE=true
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - OTEL_SERVICE_NAME=xlink-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_SAMPLING_RATIO=1.0
      - PPROF_ENABLED=false
    depends_on:
      - postgres
      - redis
      - jaeger

  postgres:
    image: postgres:16-alpine
    container_name: xlink-postgres
    restart: always
    environment:
      POSTGRES_DB: xlink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: xlink-redis
    restart: always
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: xlink-prometheus
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: xlink-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: xlink-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
