version: '3.8'

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: xlink-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_URL=postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/xlink?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-replace-with-at-least-32-byte-secret-key-here}
      - AUTO_MIGRATE=true
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: xlink-postgres
    restart: always
    environment:
      POSTGRES_DB: xlink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: xlink-redis
    restart: always
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  redis_data:
